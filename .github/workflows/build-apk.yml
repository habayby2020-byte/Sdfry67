name: Layali Riyadh APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Verify games and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare complete game assets without replacing the app library
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2, copytree
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path.cwd()
          assets = root / "app/src/main/assets"
          assets.mkdir(parents=True, exist_ok=True)
          candidates = [root / "public/مكتبة_الألعاب-2.html", assets / "مكتبة_الألعاب-2.html", root / "مكتبة_الألعاب-2.html", assets / "مكتبة_الألعاب-1.html"]
          library = next((p for p in candidates if p.is_file() and p.stat().st_size >= 1000), None)
          if library is None:
              raise SystemExit("The app-specific game library asset is missing or incomplete.")
          copy2(library, assets / "game-library.html")
          excluded = {"index.html", "مكتبة_الألعاب-1.html", "مكتبة_الألعاب-2.html"}
          games = sorted(p for p in root.glob("*.html") if p.name not in excluded)
          if not games:
              raise SystemExit("No standalone HTML game files were found.")
          for src in games:
              copy2(src, assets / src.name)
          prepared = root / "prepared-games"
          if prepared.is_dir():
              copytree(prepared, assets / "prepared-games", dirs_exist_ok=True)
          with ZipFile(assets / "game-files-bundle.zip", "w", ZIP_DEFLATED) as bundle:
              for game in games:
                  bundle.write(game, game.name)
              if prepared.is_dir():
                  for item in sorted(prepared.rglob("*")):
                      if item.is_file():
                          bundle.write(item, item.relative_to(root).as_posix())
          print(f"Prepared {len(games)} root-level HTML games and prepared-games tree.")
          PY

      - name: Check game HTML and inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, tempfile
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.items=[]; self.cur=None
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="script": self.cur={"attrs":dict(attrs),"code":""}
              def handle_data(self,data):
                  if self.cur is not None: self.cur["code"]+=data
              def handle_endtag(self,tag):
                  if tag.lower()=="script" and self.cur is not None: self.items.append(self.cur); self.cur=None
          excluded={"index.html","مكتبة_الألعاب-1.html","مكتبة_الألعاب-2.html"}
          games=sorted(p for p in Path.cwd().glob("*.html") if p.name not in excluded)
          games += sorted(Path("prepared-games").rglob("*.html")) if Path("prepared-games").exists() else []
          targets=games+[Path("app/src/main/assets/game-library.html")]
          checked=0
          with tempfile.TemporaryDirectory() as tmp:
              for game in targets:
                  html=game.read_text(encoding="utf-8",errors="replace")
                  if "<html" not in html.lower() or "<body" not in html.lower(): raise SystemExit(f"Incomplete HTML: {game}")
                  parser=Scripts(); parser.feed(html)
                  for item in parser.items:
                      if item["attrs"].get("src") or not item["code"].strip(): continue
                      typ=item["attrs"].get("type","text/javascript").lower()
                      if typ not in ("text/javascript","application/javascript","module"): continue
                      ext=".mjs" if typ=="module" else ".js"
                      f=Path(tmp)/f"check_{checked}{ext}"; f.write_text(item["code"],encoding="utf-8")
                      result=subprocess.run(["node","--check",str(f)],capture_output=True,text=True)
                      if result.returncode: print(result.stderr); raise SystemExit(result.returncode)
                      checked+=1
                  print(f"Checked {game}")
          print(f"Inline scripts passed: {checked}")
          PY

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Layali-Riyadh-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
