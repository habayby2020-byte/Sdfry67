.house-btn.selected{border-color:#ffd166;background:rgba(255,154,61,.25);box-shadow:0 0 0 2px rgba(255,209,102,.4)}

/* ===================== EMB BRIDGE (لا تغيّر هذا الجزء) ===================== */
let EMB=null; const embHostConns={};
window.addEventListener('message', e=>{
  const m=e&&e.data; if(!m||!m.__emb) return;
  if(m.init){ EMB={role:m.role,code:m.code,name:m.name}; return embStart(); }
  if(!EMB) return;
  if(EMB.role==='tv'){
    if(m.event==='data'){
      let c=embHostConns[m.id];
      if(!c)c=embHostConns[m.id]={id:m.id,send:obj=>{try{parent.postMessage({__emb:1,to:m.id,data:obj},'*')}catch(e){}}};
      try{onHostMsg(c,m.data)}catch(e){}
    } else if(m.event==='disconnect'){
      try{onPlayerLeave(m.id)}catch(e){}
      delete embHostConns[m.id];
    }
  } else if(EMB.role==='ph'){
    if(m.data!==undefined){try{onCtlMsg(m.data)}catch(e){}}
  }
});
function embReveal(){try{document.documentElement.classList.remove('emb-pending')}catch(e){}}
function embStart(){
  embReveal();
  if(EMB.role==='tv'){ startTv(); } else { startPhone(); }
}
setTimeout(()=>{ if(!EMB) embReveal(); }, 2500);

const BOT_POOL = ['سعود','نورة','فيصل','العنود','مشعل','سارة','بندر','لطيفة','طلال','مها','فهد','ريم'];
const FLOWER_COLORS = ['#f43f5e','#fbbf24','#a855f7','#ec4899','#fb923c','#38bdf8','#34d399','#facc15'];
const ROLE_INFO = {
  mafia:{ar:'مافيا',desc:'تسلل ليلاً واختر بيتاً لتصفيته بسرية.',color:'#ef4444'},
  doctor:{ar:'الطبيب',desc:'احمِ أحد السكان كل ليلة من هجوم المافيا.',color:'#10b981'},
  detective:{ar:'المحقق',desc:'تحرَّ عن البيوت ليلاً لكشف هوية أصحابها.',color:'#38bdf8'},
  mayor:{ar:'عمدة القرية',desc:'صوتك عند الطاولة يُحسب بصوتين.',color:'#f59e0b'},
  villager:{ar:'قروي',desc:'راقب الأدلة وصوّت لكشف المافيا.',color:'#e2d4bd'}
};

let G = null;
let tvAnimId = 0;
let tvTimerId = 0;
let shootingStars = [];

function makeInitialState(code){
  return {
    code: code || String(Math.floor(1000 + Math.random()*9000)),
    phase: 'lobby',
    round: 0,
    players: [],
    night: { mafiaTargetId:null, mafiaVotes:{}, doctorTargetId:null, detectiveTargetId:null, detectiveResult:null, lastDocId:null },
    votes: {},
    morningText: '',
    clueText: '',
    clues: [],
    winner: null,
    winReason: ''
  };
}

function addPlayerToG(id, name, isBot){
  if(!G || G.phase!=='lobby' || G.players.length>=12) return;
  const exist = G.players.find(p=>p.id===id);
  if(exist){ exist.name = (name||exist.name).slice(0,18); return; }
  const idx = G.players.length;
  G.players.push({
    id, name:(name||('لاعب '+(idx+1))).slice(0,18), isBot:!!isBot,
    role:'villager', alive:true, idx, side: idx%2===0?'left':'right', slot: Math.floor(idx/2),
    flower: FLOWER_COLORS[idx % FLOWER_COLORS.length], walkT: 0
  });
}

function fillBots(target){
  const used = new Set(G.players.map(p=>p.name));
  let b=1;
  for(const n of BOT_POOL){
    if(G.players.length>=target) break;
    if(!used.has(n)){ used.add(n); addPlayerToG('bot_'+b, n, true); b++; }
  }
}

function assignRolesAndStart(){
  if(G.players.length<6) fillBots(6);
  const n = G.players.length;
  const mCount = n>=11?3:(n>=8?2:1);
  const pool = [];
  for(let i=0;i<mCount;i++) pool.push('mafia');
  pool.push('doctor','detective');
  if(n>=7) pool.push('mayor');
  while(pool.length<n) pool.push('villager');
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp;
  }
  G.players.forEach((p,i)=>{ p.role=pool[i]; p.alive=true; });
  G.round=1; G.phase='role_reveal'; G.clues=[]; G.winner=null;
  broadcastAll();
}

function broadcastAll(){
  if(!G) return;
  Object.keys(embHostConns).forEach(id=>{
    const p = G.players.find(x=>x.id===id);
    const snap = {
      code: G.code, phase: G.phase, round: G.round,
      morningText: G.morningText, clueText: G.clueText, winner: G.winner, winReason: G.winReason,
      me: p ? { id:p.id, name:p.name, role:p.role, alive:p.alive } : null,
      detectiveResult: (p && p.role==='detective') ? G.night.detectiveResult : null,
      players: G.players.map(x=>({ id:x.id, name:x.name, alive:x.alive, side:x.side, slot:x.slot, flower:x.flower, role: (G.phase==='gameover'||!x.alive)?x.role:null }))
    };
    embHostConns[id].send(snap);
  });
  renderTvOverlay();
}

function startNight(){
  if(G.phase==='voting') G.round++;
  G.phase='night_mafia';
  G.votes={};
  G.night.mafiaTargetId=null; G.night.mafiaVotes={}; G.night.doctorTargetId=null; G.night.detectiveTargetId=null; G.night.detectiveResult=null;
  broadcastAll();
  scheduleBotNightIfNeeded();
}

function nextNightStep(from){
  const hasDoc = G.players.some(p=>p.alive && p.role==='doctor');
  const hasDet = G.players.some(p=>p.alive && p.role==='detective');
  if(from==='night_mafia'){
    G.phase = hasDoc ? 'night_doctor' : (hasDet ? 'night_detective' : 'morning_report');
  } else if(from==='night_doctor'){
    G.phase = hasDet ? 'night_detective' : 'morning_report';
  } else {
    G.phase = 'morning_report';
  }
  if(G.phase==='morning_report') resolveMorningPhase();
  else { broadcastAll(); scheduleBotNightIfNeeded(); }
}

function resolveMorningPhase(){
  const target = G.players.find(p=>p.id===G.night.mafiaTargetId && p.alive);
  const saved = target && G.night.doctorTargetId === target.id;
  if(target && !saved){
    target.alive = false;
    G.morningText = 'فُجع أهل القرية بغياب ' + target.name + ' عند طاولة التجمع.';
  } else if(target && saved){
    G.morningText = 'الطبيب أنقذ ' + target.name + ' في اللحظة الأخيرة!';
  } else {
    G.morningText = 'أشرقت شمس هادئة ولم يصب أحد بأذى.';
  }
  const maf = G.players.find(p=>p.alive && p.role==='mafia');
  const sideAr = maf && maf.side==='left' ? 'الجهة اليسرى' : 'الجهة اليمنى';
  G.clueText = 'آثار أقدام خفيفة في الحصى تتجه نحو ' + sideAr + ' قرب اللمبة الحديثة.';
  G.clues.push(G.clueText);
  G.night.lastDocId = G.night.doctorTargetId;
  G.phase = 'morning_report';
  checkWinner();
  broadcastAll();
}

function checkWinner(){
  const m = G.players.filter(p=>p.alive && p.role==='mafia').length;
  const v = G.players.filter(p=>p.alive && p.role!=='mafia').length;
  if(m===0){ G.winner='villagers'; G.winReason='انتصر أهل القرية وكشفوا المافيا!'; G.phase='gameover'; }
  else if(m>=v){ G.winner='mafia'; G.winReason='سيطرت المافيا على الحارة النجدية!'; G.phase='gameover'; }
}

function resolveDayVotes(){
  const tally={};
  Object.keys(G.votes).forEach(vid=>{
    const voter = G.players.find(p=>p.id===vid && p.alive);
    if(!voter) return;
    const tid = G.votes[vid];
    tally[tid] = (tally[tid]||0) + (voter.role==='mayor'?2:1);
  });
  const sorted = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  if(sorted.length && sorted[0][0]!=='skip' && !(sorted[1] && sorted[1][1]===sorted[0][1])){
    const elim = G.players.find(p=>p.id===sorted[0][0]);
    if(elim){
      elim.alive=false;
      G.morningText = 'تم إقصاء ' + elim.name + ' (' + ROLE_INFO[elim.role].ar + ').';
    }
  } else {
    G.morningText = 'تعادلت الأصوات ولم يُقصَ أحد.';
  }
  checkWinner();
  if(G.phase!=='gameover') startNight();
  else broadcastAll();
}

function scheduleBotNightIfNeeded(){
  clearTimeout(tvTimerId);
  tvTimerId = setTimeout(()=>{
    if(!G) return;
    if(G.phase==='night_mafia'){
      const bots = G.players.filter(p=>p.alive && p.role==='mafia' && p.isBot && !G.night.mafiaVotes[p.id]);
      const targets = G.players.filter(p=>p.alive && p.role!=='mafia');
      if(bots.length && targets.length){
        bots.forEach(b=>{ G.night.mafiaVotes[b.id] = targets[Math.floor(Math.random()*targets.length)].id; });
        const aliveM = G.players.filter(p=>p.alive && p.role==='mafia');
        if(aliveM.every(m=>G.night.mafiaVotes[m.id])){
          G.night.mafiaTargetId = G.night.mafiaVotes[aliveM[0].id];
          nextNightStep('night_mafia');
        }
      }
    } else if(G.phase==='night_doctor'){
      const doc = G.players.find(p=>p.alive && p.role==='doctor' && p.isBot);
      if(doc){
        const cands = G.players.filter(p=>p.alive && p.id!==G.night.lastDocId);
        const pick = (cands.length?cands:G.players.filter(p=>p.alive))[0];
        if(pick) G.night.doctorTargetId = pick.id;
        nextNightStep('night_doctor');
      }
    } else if(G.phase==='night_detective'){
      const det = G.players.find(p=>p.alive && p.role==='detective' && p.isBot);
      if(det){
        const cands = G.players.filter(p=>p.alive && p.id!==det.id);
        const pick = cands[Math.floor(Math.random()*cands.length)];
        if(pick){
          G.night.detectiveTargetId = pick.id;
          G.night.detectiveResult = { targetId:pick.id, targetName:pick.name, isMafia:pick.role==='mafia' };
        }
        nextNightStep('night_detective');
      }
    } else if(G.phase==='voting'){
      G.players.filter(p=>p.alive && p.isBot && !G.votes[p.id]).forEach(b=>{
        const cands = G.players.filter(p=>p.alive && p.id!==b.id && !(b.role==='mafia'&&p.role==='mafia'));
        G.votes[b.id] = cands.length ? cands[Math.floor(Math.random()*cands.length)].id : 'skip';
      });
      if(G.players.filter(p=>p.alive).every(p=>G.votes[p.id])) resolveDayVotes();
      else broadcastAll();
    }
  }, 900);
}

function onHostMsg(c, data){
  if(!G || !data) return;
  if(data.t==='join'){
    addPlayerToG(c.id, data.name || 'لاعب', false);
    broadcastAll();
  } else if(data.t==='mafia_kill' && G.phase==='night_mafia'){
    const actor = G.players.find(p=>p.id===c.id && p.alive && p.role==='mafia');
    const target = G.players.find(p=>p.id===data.targetId && p.alive && p.role!=='mafia');
    if(actor && target){
      G.night.mafiaVotes[actor.id]=target.id;
      G.night.mafiaTargetId=target.id;
      nextNightStep('night_mafia');
    }
  } else if(data.t==='doctor_heal' && G.phase==='night_doctor'){
    const actor = G.players.find(p=>p.id===c.id && p.alive && p.role==='doctor');
    const target = G.players.find(p=>p.id===data.targetId && p.alive);
    if(actor && target){ G.night.doctorTargetId=target.id; nextNightStep('night_doctor'); }
  } else if(data.t==='detective_inspect' && G.phase==='night_detective'){
    const actor = G.players.find(p=>p.id===c.id && p.alive && p.role==='detective');
    const target = G.players.find(p=>p.id===data.targetId && p.alive && p.id!==actor.id);
    if(actor && target){
      G.night.detectiveTargetId=target.id;
      G.night.detectiveResult={targetId:target.id,targetName:target.name,isMafia:target.role==='mafia'};
      nextNightStep('night_detective');
    }
  } else if(data.t==='vote' && G.phase==='voting'){
    const actor = G.players.find(p=>p.id===c.id && p.alive);
    if(actor){
      G.votes[actor.id] = data.targetId || 'skip';
      if(G.players.filter(p=>p.alive).every(p=>G.votes[p.id])) resolveDayVotes();
      else broadcastAll();
    }
  }
}

function onPlayerLeave(id){
  if(!G) return;

  if(!p) return;
  if(G.phase==='lobby') G.players = G.players.filter(x=>x.id!==id);
  else p.alive = false;
  broadcastAll();
}

    rowsHtml += '<div>' + (right[i] ? houseCard(right[i]) : '') + '</div>';

  let actionBar = '';

    const lbl = phase==='night_mafia' ? 'تصفية [مشفر]' : (phase==='night_doctor' ? 'حماية البيت' : 'تحقيق سري');

      '<button class="btn-dark" onclick="submitPhVote(true)">تخطي</button>' +

  root.innerHTML = '<div class="ph-wrap">' +
    '<div class="ph-head">' +
      '<div style="font-size:15px;font-weight:900">' + roleChip + '</div>' +
      '<button class="btn-dark" style="padding:6px 10px;font-size:12px" onclick="togglePhHide()">' + (phHideRole ? 'إظهار' : 'إخفاء') + '</button>' +
    '</div>' +

      '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px;color:#ffd166"><span>خريطة القرية</span><span style="color:#cbb9e2">غرفة ' + phState.code + '</span></div>' +
      '<div class="map-grid">' + rowsHtml + '</div>' +
    '</div>' +

  '</div>';
}

/* ===================== 2.5D NAJDI VILLAGE CANVAS RENDERER ===================== */
function initStarfield(){
  starsList = [];
  for(let i=0;i<90;i++){
    starsList.push({x:Math.random(),y:Math.random()*0.44,r:0.8+Math.random()*1.6,tw:Math.random()*6.28});
  }
  shootingStars = [];
}

function startTvCanvasLoop(){
  cancelAnimationFrame(tvAnimId);
  let lastT = performance.now();
  function frame(now){
    const dt = Math.min((now-lastT)/1000, 0.05);
    lastT = now;
    drawNajdiVillage25D(now/1000, dt);
    tvAnimId = requestAnimationFrame(frame);
  }
  tvAnimId = requestAnimationFrame(frame);
}

function drawNajdiVillage25D(t, dt){
  const c = document.getElementById('tvCanvas');
  if(!c || !G) return;
  const w = c.width = c.clientWidth || window.innerWidth;
  const h = c.height = c.clientHeight || window.innerHeight;
  const ctx = c.getContext('2d');
  const isNight = G.phase==='night_mafia'||G.phase==='night_doctor'||G.phase==='night_detective';

  // Sky: deep purple at night, warm Najdi dusk/morning otherwise
  const skyGrad = ctx.createLinearGradient(0,0,0,h*0.48);
  if(isNight){
    skyGrad.addColorStop(0,'#120521');
    skyGrad.addColorStop(0.6,'#2d1050');
    skyGrad.addColorStop(1,'#4c1d6b');
  } else {
    skyGrad.addColorStop(0,'#2e4c78');
    skyGrad.addColorStop(0.6,'#8d7c98');
    skyGrad.addColorStop(1,'#eab676');
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,w,h*0.48);

  if(isNight){
    // Stars
    starsList.forEach(s=>{
      const alpha = 0.4 + 0.6*Math.abs(Math.sin(t*1.8 + s.tw));
      ctx.fillStyle = 'rgba(255,248,220,' + alpha.toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(s.x*w, s.y*h, s.r, 0, Math.PI*2);
      ctx.fill();
    });
    // Crescent moon
    const mx = w*0.18, my = h*0.14;
    ctx.fillStyle = '#fff0b3';
    ctx.beginPath(); ctx.arc(mx,my,26,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#200a38';
    ctx.beginPath(); ctx.arc(mx+10,my-5,23,0,Math.PI*2); ctx.fill();
    // Shooting stars
    if(Math.random()<0.03 && shootingStars.length<3){
      shootingStars.push({x:w*(0.3+Math.random()*0.6),y:h*(0.04+Math.random()*0.18),vx:-420-Math.random()*200,vy:140+Math.random()*90,life:1});
    }
    shootingStars = shootingStars.filter(s=>{
      s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt*1.1;
      if(s.life<=0) return false;
      ctx.strokeStyle = 'rgba(255,244,195,' + s.life.toFixed(2) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*0.09,s.y-s.vy*0.09); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x,s.y,2.8,0,Math.PI*2); ctx.fill();
      return true;
    });
  } else {
    // Sun glow
    ctx.fillStyle='rgba(255,220,145,0.85)';
    ctx.beginPath(); ctx.arc(w*0.8,h*0.18,32,0,Math.PI*2); ctx.fill();
  }

  // Ground (Desert + pitch black at night when lamps are OFF!)
  const hy = h*0.46;
  ctx.fillStyle = isNight ? '#040207' : '#c99b63';
  ctx.fillRect(0, hy, w, h - hy);

  // Central gravel/dirt street perspective trapezoid
  ctx.fillStyle = isNight ? '#09060d' : '#8a6845';
  ctx.beginPath();
  ctx.moveTo(w*0.44, hy);
  ctx.lineTo(w*0.56, hy);
  ctx.lineTo(w*0.82, h);
  ctx.lineTo(w*0.18, h);
  ctx.closePath();
  ctx.fill();

  // Central gathering table
  const ty = hy + (h-hy)*0.42;
  ctx.fillStyle = isNight ? '#120b16' : '#5e371f';
  ctx.beginPath(); ctx.ellipse(w*0.5, ty, w*0.045, h*0.022, 0, 0, Math.PI*2); ctx.fill();

  // Houses & 6 Modern Street Lamps
  const count = Math.max(6, G.players.length || 6);
  const rows = Math.ceil(count/2);
  for(let r=rows-1; r>=0; r--){
    const depth = (r+1)/(rows+0.8);
    const py = hy + (h-hy)*(0.12 + depth*0.68);
    const scale = 0.48 + depth*0.58;
    const hw = 72*scale, hh = 56*scale;
    const spread = w*(0.13 + depth*0.24);
    const leftP = G.players.find(p=>p.side==='left'&&p.slot===r);
    const rightP = G.players.find(p=>p.side==='right'&&p.slot===r);

    drawHouse(ctx, w*0.5 - spread - hw, py - hh, hw, hh, leftP, isNight);
    drawHouse(ctx, w*0.5 + spread, py - hh, hw, hh, rightP, isNight);

    // Street lamp
    if(r<3){
      const lxL = w*0.5 - spread*0.62, lxR = w*0.5 + spread*0.62;
      drawLamp(ctx, lxL, py, scale, !isNight);
      drawLamp(ctx, lxR, py, scale, !isNight);
    }
  }

  // Simple Villager Characters (outside around table in day, inside houses at night)
  G.players.forEach((p, idx)=>{
    if(!p.alive) return;
    if(isNight) return; // inside their houses!
    const angle = (idx / Math.max(1,G.players.length)) * Math.PI * 2 + Math.sin(t*0.8+idx)*0.04;
    const cx = w*0.5 + Math.cos(angle)*w*0.075;
    const cy = ty + Math.sin(angle)*h*0.04;
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath(); ctx.ellipse(cx, cy+10, 8, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f1e4d0';
    ctx.fillRect(cx-6, cy-10, 12, 20);
    ctx.fillStyle = '#e6c39c';
    ctx.beginPath(); ctx.arc(cx, cy-15, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.font = '700 11px Tajawal, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, cx, cy-25);
  });
}

function drawHouse(ctx, x, y, w, h, player, isNight){
  // Najdi mud house body
  ctx.fillStyle = isNight ? '#0d0912' : '#b78456';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = isNight ? '#1f1629' : '#7c5330';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y, w, h);
  // Door
  const dw = w*0.26, dh = h*0.48;
  ctx.fillStyle = isNight ? '#050308' : '#4e2b15';
  ctx.fillRect(x + w*0.5 - dw*0.5, y + h - dh, dw, dh);
  // Flower pot next to door
  ctx.fillStyle = isNight ? '#150d1c' : '#a84a2a';
  ctx.fillRect(x + w*0.14, y + h - h*0.16, w*0.14, h*0.16);
  ctx.fillStyle = isNight ? '#1f1428' : (player ? player.flower : '#f43f5e');
  ctx.beginPath(); ctx.arc(x + w*0.21, y + h - h*0.2, w*0.07, 0, Math.PI*2); ctx.fill();
  // Large Name Board above the house
  const label = player ? (player.alive ? player.name : player.name + ' ✕') : 'بيت خالي';
  ctx.fillStyle = isNight ? 'rgba(20,10,32,0.92)' : 'rgba(25,13,38,0.88)';
  ctx.fillRect(x - 6, y - 26, w + 12, 22);
  ctx.strokeStyle = player && !player.alive ? '#ef4444' : '#ffd166';
  ctx.strokeRect(x - 6, y - 26, w + 12, 22);
  ctx.fillStyle = player && !player.alive ? '#fca5a5' : '#ffd166';
  ctx.font = '800 13px Tajawal, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w*0.5, y - 10);
}

function drawLamp(ctx, x, y, scale, isOn){
  const lh = 70*scale;
  ctx.strokeStyle = '#312b3d';
  ctx.lineWidth = 3*scale;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-lh); ctx.stroke();
  ctx.fillStyle = isOn ? '#ffd166' : '#1b1724';
  ctx.beginPath(); ctx.arc(x, y-lh, 5*scale, 0, Math.PI*2); ctx.fill();
  if(isOn){
    ctx.fillStyle = 'rgba(255,209,102,0.16)';
    ctx.beginPath(); ctx.arc(x, y-lh, 24*scale, 0, Math.PI*2); ctx.fill();
  }
}

function startStandaloneSim(){
  EMB = { role:'tv', code:'4821', name:'المضيف' };
  startTv();
  tvQuickSim();
}
